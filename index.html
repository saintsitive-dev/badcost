<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/badcost/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/badcost/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BadCost" />
    <title>BadCost 🏸</title>
    <!-- GitHub Pages SPA redirect handler -->
    <script>
      (function(l) {
        var params = new URLSearchParams(l.search);
        var p = params.get('p');
        if (p) {
          var restored = '/badcost' + p.replace(/~and~/g, '&');
          var q = params.get('q');
          if (q) restored += '?' + q.replace(/~and~/g, '&');
          window.history.replaceState(null, null, restored + l.hash);
        }
      }(window.location))
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

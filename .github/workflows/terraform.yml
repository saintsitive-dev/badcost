name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve -no-color

      - name: Verify Firestore rules
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "$GOOGLE_CREDENTIALS" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          TOKEN=$(gcloud auth print-access-token)
          echo "=== Active Release ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/${TF_VAR_gcp_project_id}/releases/cloud.firestore%2Fdatabase%2F(default)%2Fdocuments" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('Ruleset:', d.get('rulesetName','NOT FOUND'))
          rn=d.get('rulesetName','')
          " 
          RULESET=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/${TF_VAR_gcp_project_id}/releases/cloud.firestore%2Fdatabase%2F(default)%2Fdocuments" | python3 -c "import json,sys;print(json.load(sys.stdin).get('rulesetName',''))")
          echo "=== Ruleset Content ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/${RULESET}" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          content=d.get('source',{}).get('files',[{}])[0].get('content','EMPTY')
          print(content[:300])
          "
          rm -f /tmp/sa.json

      - name: Commit updated state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/terraform.tfstate
          git diff --cached --quiet || git commit -m "chore: update terraform state [skip ci]"
          git push

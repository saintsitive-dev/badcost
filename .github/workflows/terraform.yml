name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TF_VAR_gcp_project_id: ${{ secrets.GCP_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          terraform state rm google_firebaserules_release.firestore || true
          terraform import google_firebaserules_release.firestore projects/${TF_VAR_gcp_project_id}/releases/cloud.firestore || true
          terraform apply -auto-approve -no-color

      - name: Verify Firestore rules
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "$GOOGLE_CREDENTIALS" > /tmp/sa.json
          gcloud auth activate-service-account --key-file=/tmp/sa.json --quiet
          TOKEN=$(gcloud auth print-access-token)
          echo "=== Listing all releases ==="
          curl -s -H "Authorization: Bearer $TOKEN" \
            "https://firebaserules.googleapis.com/v1/projects/${TF_VAR_gcp_project_id}/releases" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for r in d.get('releases',[]):
            print(f\"  {r['name']} -> {r.get('rulesetName','?')}\")
          "
          echo "=== Creating ruleset with correct rules ==="
          RULESET_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"source\":{\"files\":[{\"name\":\"firestore.rules\",\"content\":$(python3 -c "import json; print(json.dumps(open('firestore.rules').read()))")}]}}" \
            "https://firebaserules.googleapis.com/v1/projects/${TF_VAR_gcp_project_id}/rulesets")
          RULESET_NAME=$(echo "$RULESET_RESPONSE" | python3 -c "import json,sys;print(json.load(sys.stdin)['name'])")
          echo "Created: $RULESET_NAME"
          echo "=== Updating cloud.firestore release ==="
          curl -s -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"release\":{\"rulesetName\":\"${RULESET_NAME}\"}}" \
            "https://firebaserules.googleapis.com/v1/projects/${TF_VAR_gcp_project_id}/releases/cloud.firestore" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'error' in d:
            print(f\"ERROR: {d['error']}\")
          else:
            print(f\"Updated cloud.firestore -> {d.get('rulesetName','?')}\")
          "
          echo "=== Updating database-specific release ==="
          curl -s -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"release\":{\"rulesetName\":\"${RULESET_NAME}\"}}" \
            "https://firebaserules.googleapis.com/v1/projects/${TF_VAR_gcp_project_id}/releases/cloud.firestore%2Fdatabase%2F%28default%29%2Fdocuments" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'error' in d:
            print(f\"ERROR: {d['error']}\")
          else:
            print(f\"Updated cloud.firestore/database/(default)/documents -> {d.get('rulesetName','?')}\")
          "
          rm -f /tmp/sa.json

      - name: Commit updated state
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infrastructure/terraform.tfstate
          git diff --cached --quiet || git commit -m "chore: update terraform state [skip ci]"
          git push

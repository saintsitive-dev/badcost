<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>BadCost 🏸</title>
    <script>
      // GitHub Pages SPA redirect
      // Redirects to /badcost/ with the remaining path encoded in the query string
      var l = window.location;
      var path = l.pathname.replace('/badcost', '').replace(/^\//, '');
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/badcost/?p=/' + path.replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
